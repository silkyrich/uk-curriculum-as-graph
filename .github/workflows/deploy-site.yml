name: Redirect old GitHub Pages URL to Cloudflare

# The Curriculum Explorer site has migrated to Cloudflare Pages:
#   https://curriculum.richmorgan.co.uk
#
# This workflow publishes a small redirect stub at the old GitHub Pages
# URL (https://silkyrich.github.io/uk-curriculum-as-graph/) so existing
# links keep working. The stub is path-preserving — a deep link such as
# /uk-curriculum-as-graph/years/Y4/ forwards to the matching page on the
# new domain.
#
# NOTE: this replaced the previous build-and-deploy pipeline. The site is
# now built and deployed to Cloudflare Pages (project "uk-curriculum").
# Wiring that build into CI is a follow-up — for now the site is deployed
# manually via:  cd site && npm run build && wrangler pages deploy dist
#                  --project-name=uk-curriculum

on:
  push:
    branches: [main]
    paths:
      - 'gh-pages-redirect/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-redirect:
    name: Publish redirect stub to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload redirect stub
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-redirect/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
